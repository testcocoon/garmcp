# Exemple de configuration Apache2 pour exposer le connecteur garmcp
# à Mistral Chat (connecteur MCP personnalisé) via un reverse proxy HTTPS.
#
# Mistral Chat exige généralement une URL publique en HTTPS. Ce vhost
# proxifie https://garmcp.example.com vers le serveur local garmcp.
#
# Installation :
#   1. Démarrer le serveur garmcp (voir ci-dessous, systemd recommandé)
#      Avec un préfixe de base URL : GARMCP_BASE_URL=baseurl (ou
#      garmcp --http --base-url baseurl), le serveur répond sur
#      http://127.0.0.1:8000/baseurl/mcp
#   2. sudo cp garmcp-apache.conf /etc/apache2/sites-available/garmcp.conf
#   3. sudo a2enmod proxy proxy_http proxy_wstunnel ssl rewrite headers
#   4. sudo a2ensite garmcp
#   5. Adapter ServerName, certificats, port et BASE ci-dessous, puis :
#      sudo apache2ctl configtest && sudo systemctl reload apache2
#   6. Dans Mistral Chat : Connecteurs > + Ajouter un connecteur >
#      Connecteur MCP personnalisé > URL : https://garmcp.example.com/mcp
#      (ou https://garmcp.example.com/baseurl/mcp si BASE est défini)
#
# Les deux transports sont proxyfiés :
#   - /mcp      : streamable-http (défaut, recommandé)
#   - /sse + /messages/ : SSE (ancien transport, si nécessaire)

# Préfixe de base URL : vide pour servir à la racine (/mcp),
# sinon par ex. "baseurl" pour servir sous /baseurl/mcp.
Define BASE ""
# En définissant BASE, remplacez les chemins /mcp, /sse, /messages
# par /baseurl/mcp, /baseurl/sse, /baseurl/messages/ (voir Location).

<VirtualHost *:443>
    ServerName garmcp.example.com

    # --- TLS (obligatoire pour Mistral Chat) ---
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/garmcp.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/garmcp.example.com/privkey.pem
    SSLProtocol             -all +TLSv1.2 +TLSv1.3

    # --- Proxy vers garmcp (127.0.0.1:8000) ---
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    # Timeouts longs : les sessions MCP (SSE/streamable-http) restent
    # ouvertes tant que le connecteur est actif.
    ProxyTimeout 3600

    # Transport streamable-http (recommandé) : POST/GET sur /mcp
    # Avec une base URL (garmcp --http --base-url baseurl), proxifiez
    # "/baseurl/mcp" -> http://127.0.0.1:8000/baseurl/mcp
    <Location "/mcp">
        ProxyPass "http://127.0.0.1:8000/mcp"
        ProxyPassReverse "http://127.0.0.1:8000/mcp"
        # SSE/HTTP-streaming : ne pas bufferiser les réponses
        SetEnv proxy-sendchunked 1
        SetEnv proxy-initial-not-pooled 1
    </Location>

    # Transport SSE (ancien) : GET /sse + POST /messages/
    <Location "/sse">
        ProxyPass "http://127.0.0.1:8000/sse"
        ProxyPassReverse "http://127.0.0.1:8000/sse"
        SetEnv proxy-sendchunked 1
        # Désactive la compression qui casserait le flux SSE
        RequestHeader unset Accept-Encoding
    </Location>
    <Location "/messages">
        ProxyPass "http://127.0.0.1:8000/messages/"
        ProxyPassReverse "http://127.0.0.1:8000/messages/"
        SetEnv proxy-sendchunked 1
    </Location>

    # Redirection racine pratique
    RedirectMatch ^/$ /mcp

    # --- En-têtes de sécurité ---
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    # --- Logs ---
    ErrorLog  ${APACHE_LOG_DIR}/garmcp-error.log
    CustomLog ${APACHE_LOG_DIR}/garmcp-access.log combined
</VirtualHost>

# Redirection HTTP -> HTTPS
<VirtualHost *:80>
    ServerName garmcp.example.com
    Redirect permanent / https://garmcp.example.com/
</VirtualHost>
